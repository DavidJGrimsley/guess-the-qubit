[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=5FA6F77E4FC5510551423C89CB7EE0A1

; UE 5.8 Game Features requires an Asset Manager rule for the GameFeatureData primary asset type.
; The editor-only AllToolsets -> GameFeaturesToolset -> GameFeatures plugin chain loads in the editor
; during cook, and without this entry LogGameFeatures/LoadErrors log errors that fail BuildCookRun.
; bIsEditorOnly=True registers the type only where GameFeatures is loaded (editor and the cook commandlet). The packaged game does
; not load the editor-only GameFeatures plugin, so a non-editor-only entry would fail to resolve /Script/GameFeatures.GameFeatureData
; at game startup. This project has no game feature plugins; the unused directory keeps the type registered without scanning content.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

