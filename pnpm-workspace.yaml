packages:
  - 'apps/*'

nodeLinker: hoisted

# Narrow compatibility overrides that mirror the original apps/expo npm `overrides` block.
overrides:
  'query-string@7.1.3>decode-uri-component': '0.5.0'
  'xcode@3.0.1>uuid': '11.1.1'

patchedDependencies:
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch

allowBuilds:
  unrs-resolver: true
