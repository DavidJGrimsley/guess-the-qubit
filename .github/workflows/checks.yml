name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Verify Unreal orchestration host check and release matrix
        run: |
          pnpm run unreal:check
          pnpm run unreal:matrix
      - name: Run Expo lint, typecheck, and tests
        run: |
          pnpm run expo:lint
          pnpm run expo:typecheck
          pnpm run expo:test
      - name: Run serial iOS and Android exports
        run: |
          pnpm run expo:build:ios
          pnpm run expo:build:android
